<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>P.G: Imperio</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#10061e">
<meta name="description" content="P.G: Imperio - juego idle de estetica neon.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<canvas id="canvas" tabindex="-1" oncontextmenu="return false;"></canvas>

<div id="loading" class="overlay" role="status" aria-live="polite">
  <div class="scene"><div class="sun"></div><div class="floor"><div class="grid"></div></div></div>
  <div class="box">
    <h2 id="load-title">Cargando...</h2>
    <div class="bar"><i id="bar"></i></div>
    <div id="status">Preparando...</div>
  </div>
</div>

<div id="menu" class="overlay">
  <div class="scene" style="opacity:.55"><div class="sun"></div><div class="floor"><div class="grid"></div></div></div>
  <div class="panel" style="position:relative">
    <h1>P.G: IMPERIO</h1>
    <p class="sub">Construí tu imperio neón</p>
    <button id="play" class="btn play" type="button" disabled>JUGAR</button>
    <button id="menu-fs" class="btn ghost" type="button">Pantalla completa</button>
    <ul class="controls">
      <li><b>Espacio</b> golpe</li>
      <li><b>1-0</b> comprar</li>
      <li><b>B</b> cantidad</li>
      <li><b>M</b> maletín</li>
      <li><b>L</b> logros</li>
      <li><b>I</b> idioma</li>
      <li><b>T</b> temblor</li>
      <li><b>N</b> música</li>
      <li><b>↑/↓</b> volumen</li>
      <li><b>F11</b> pantalla completa</li>
    </ul>
    <p class="note">Tu partida se guarda en este navegador</p>
  </div>
</div>

<button id="hud-fs" class="btn" type="button" title="Pantalla completa (F11)" aria-label="Pantalla completa">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
</button>

<noscript>Este juego necesita JavaScript activado.</noscript>

<script src="arranque.js"></script>
<script async src="index.js"></script>
</body>
</html>
